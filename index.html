<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nave vectorial y proyectiles 2D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    color: #ccc;
  }
  h1 {
    margin-bottom: 14px;
    font-size: 1.5rem;
    color: #50ff96;
    letter-spacing: 1px;
  }
  #game-container {
    border: 2px solid #2a3a4a;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(80, 255, 150, 0.12);
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #191923;
  }
  .controls {
    margin-top: 16px;
    font-size: 0.9rem;
    color: #8899aa;
    text-align: center;
    line-height: 1.6;
  }
  .controls kbd {
    background: #1e1e2a;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 2px 7px;
    font-family: monospace;
    color: #50ff96;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <h1>Nave vectorial y proyectiles 2D</h1>
  <div id="game-container">
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>
  <div class="controls">
    <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> girar &nbsp;•&nbsp;
    <kbd>W</kbd> / <kbd>↑</kbd> avanzar &nbsp;•&nbsp;
    <kbd>S</kbd> / <kbd>↓</kbd> retroceder &nbsp;•&nbsp;
    <kbd>Espacio</kbd> disparar
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const ANCHO = 800;
const ALTO = 600;

// ========== FONDO ==========
// Si quieres usar una imagen de estrellas, descomenta las siguientes líneas
// y coloca un archivo llamado "estrellas.jpg" en la misma carpeta.
// const fondoImg = new Image();
// fondoImg.src = "estrellas.jpg";

// Por ahora usamos un fondo oscuro generado (más ligero)
function dibujarFondo() {
  // Gradiente espacial
  const grad = ctx.createLinearGradient(0, 0, 0, ALTO);
  grad.addColorStop(0, '#0b0b18');
  grad.addColorStop(1, '#12122a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, ANCHO, ALTO);

  // Estrellas aleatorias fijas (se generan una sola vez)
  if (!window._estrellas) {
    window._estrellas = [];
    for (let i = 0; i < 180; i++) {
      window._estrellas.push({
        x: Math.random() * ANCHO,
        y: Math.random() * ALTO,
        r: Math.random() * 1.4 + 0.3,
        a: Math.random() * 0.6 + 0.3
      });
    }
  }
  for (const e of window._estrellas) {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${e.a})`;
    ctx.fill();
  }
}

// ========== MODELO DE LA NAVE ==========
const modeloTriangulo = [
  [0, -25],   // punta
  [-18, 18],  // esquina izquierda
  [18, 18]    // esquina derecha
];

// ========== ESTADO ==========
let posX = 400;
let posY = 300;
let angulo = 0;
const escala = 1.5;

const VELOCIDAD_NAVE = 220;
const VELOCIDAD_GIRO = 180;
const VELOCIDAD_PROYECTIL = 420;
const COOLDOWN_DISPARO = 250;
const VIDA_PROYECTIL = 1800;

let proyectiles = [];
let ultimoDisparo = -COOLDOWN_DISPARO;
const teclas = {};

// ========== TECLADO ==========
window.addEventListener('keydown', e => {
  teclas[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  teclas[e.code] = false;
});

// ========== TRANSFORMACIÓN 2D ==========
function transformarVertice(vertice, px, py, esc, ang) {
  let [x, y] = vertice;
  x *= esc;
  y *= esc;
  const rad = ang * Math.PI / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  const xRot = x * cos - y * sin;
  const yRot = x * sin + y * cos;
  return [xRot + px, yRot + py];
}

// ========== BUCLE PRINCIPAL ==========
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  // Giro
  if (teclas['ArrowLeft'] || teclas['KeyA']) angulo -= VELOCIDAD_GIRO * dt;
  if (teclas['ArrowRight'] || teclas['KeyD']) angulo += VELOCIDAD_GIRO * dt;

  const rad = angulo * Math.PI / 180;

  // Movimiento
  if (teclas['KeyW'] || teclas['ArrowUp']) {
    posX += Math.sin(rad) * VELOCIDAD_NAVE * dt;
    posY -= Math.cos(rad) * VELOCIDAD_NAVE * dt;
  }
  if (teclas['KeyS'] || teclas['ArrowDown']) {
    posX -= Math.sin(rad) * VELOCIDAD_NAVE * dt;
    posY += Math.cos(rad) * VELOCIDAD_NAVE * dt;
  }

  // Disparo
  if (teclas['Space'] && now - ultimoDisparo >= COOLDOWN_DISPARO) {
    const [puntaX, puntaY] = transformarVertice(modeloTriangulo[0], posX, posY, escala, angulo);
    proyectiles.push({
      x: puntaX,
      y: puntaY,
      vx: Math.sin(rad) * VELOCIDAD_PROYECTIL,
      vy: -Math.cos(rad) * VELOCIDAD_PROYECTIL,
      vida: VIDA_PROYECTIL
    });
    ultimoDisparo = now;
  }

  // Actualizar proyectiles
  for (const p of proyectiles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vida -= dt * 1000;
  }
  proyectiles = proyectiles.filter(p =>
    p.x >= 0 && p.x < ANCHO && p.y >= 0 && p.y < ALTO && p.vida > 0
  );

  // Pantalla envolvente
  posX = ((posX % ANCHO) + ANCHO) % ANCHO;
  posY = ((posY % ALTO) + ALTO) % ALTO;

  // ===== DIBUJAR =====
  dibujarFondo();

  // Nave
  const vertices = modeloTriangulo.map(v => transformarVertice(v, posX, posY, escala, angulo));
  ctx.beginPath();
  ctx.moveTo(vertices[0][0], vertices[0][1]);
  for (let i = 1; i < vertices.length; i++) {
    ctx.lineTo(vertices[i][0], vertices[i][1]);
  }
  ctx.closePath();
  ctx.strokeStyle = '#32ff96';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Proyectiles
  ctx.fillStyle = '#ffdc50';
  for (const p of proyectiles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
