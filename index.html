<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nave vectorial y proyectiles 2D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Nave vectorial y proyectiles 2D</h1>

  <div id="game-container">
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>

  <div class="controls">
    <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> girar &nbsp;•&nbsp;
    <kbd>W</kbd> / <kbd>↑</kbd> avanzar &nbsp;•&nbsp;
    <kbd>S</kbd> / <kbd>↓</kbd> retroceder &nbsp;•&nbsp;
    <kbd>Espacio</kbd> disparar
  </div>

  <script src="game.js"></script>
</body>
