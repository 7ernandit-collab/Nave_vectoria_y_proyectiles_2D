<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nave vectorial y proyectiles 2D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    color: #ccc;
  }
  h1 {
    margin-bottom: 12px;
    font-size: 1.4rem;
    color: #50ff96;
    letter-spacing: 1px;
  }
  #game-container {
    position: relative;
    border: 2px solid #2a3a4a;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(80, 255, 150, 0.15);
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #191923;
  }
  .controls {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #8899aa;
    text-align: center;
    line-height: 1.5;
  }
  .controls kbd {
    background: #222;
    border: 1px solid #444;
    border-radius: 3px;
    padding: 1px 6px;
    font-family: monospace;
    color: #50ff96;
  }
</style>
</head>
<body>
  <h1>Nave vectorial y proyectiles 2D</h1>
  <div id="game-container">
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>
  <div class="controls">
    <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> girar &nbsp;|&nbsp;
    <kbd>W</kbd> / <kbd>↑</kbd> avanzar &nbsp;|&nbsp;
    <kbd>S</kbd> / <kbd>↓</kbd> retroceder &nbsp;|&nbsp;
    <kbd>Espacio</kbd> disparar
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const ANCHO = 800, ALTO = 600;

// Fondo de estrellas (se genera automáticamente)
function crearEstrellas() {
  const estrellas = [];
  for (let i = 0; i < 220; i++) {
    estrellas.push({
      x: Math.random() * ANCHO,
      y: Math.random() * ALTO,
      r: Math.random() * 1.5 + 0.3,
      a: Math.random() * 0.7 + 0.3
    });
  }
  return estrellas;
}
const estrellas = crearEstrellas();

function dibujarFondo() {
  // Fondo oscuro con gradiente
  const grad = ctx.createRadialGradient(ANCHO/2, ALTO/2, 0, ANCHO/2, ALTO/2, 500);
  grad.addColorStop(0, '#1a1a2e');
  grad.addColorStop(1, '#0a0a14');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, ANCHO, ALTO);

  // Estrellas
  for (const e of estrellas) {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220, 230, 255, ${e.a})`;
    ctx.fill();
  }
}

// Modelo de la nave
const modeloTriangulo = [[0, -25], [-18, 18], [18, 18]];

// Estado
let posX = 400, posY = 300, angulo = 0;
const escala = 1.5;

const VELOCIDAD_NAVE = 220;
const VELOCIDAD_GIRO = 180;
const VELOCIDAD_PROYECTIL = 420;
const COOLDOWN_DISPARO = 250;
const VIDA_PROYECTIL = 1800;

let proyectiles = [];
let ultimoDisparo = -COOLDOWN_DISPARO;
const teclas = {};

// Teclado
window.addEventListener('keydown', e => {
  teclas[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  teclas[e.code] = false;
});

// Transformación 2D
function transformarVertice(vertice, px, py, esc, ang) {
  let [x, y] = vertice;
  x *= esc;
  y *= esc;
  const rad = ang * Math.PI / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  return [x * cos - y * sin + px, x * sin + y * cos + py];
}

// Bucle principal
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  // Giro
  if (teclas['ArrowLeft'] || teclas['KeyA']) angulo -= VELOCIDAD_GIRO * dt;
  if (teclas['ArrowRight'] || teclas['KeyD']) angulo += VELOCIDAD_GIRO * dt;

  const rad = angulo * Math.PI / 180;

  // Movimiento
  if (teclas['KeyW'] || teclas['ArrowUp']) {
    posX += Math.sin(rad) * VELOCIDAD_NAVE * dt;
    posY -= Math.cos(rad) * VELOCIDAD_NAVE * dt;
  }
  if (teclas['KeyS'] || teclas['ArrowDown']) {
    posX -= Math.sin(rad) * VELOCIDAD_NAVE * dt;
    posY += Math.cos(rad) * VELOCIDAD_NAVE * dt;
  }

  // Disparo
  if (teclas['Space'] && now - ultimoDisparo >= COOLDOWN_DISPARO) {
    const [puntaX, puntaY] = transformarVertice(modeloTriangulo[0], posX, posY, escala, angulo);
    proyectiles.push({
      x: puntaX,
      y: puntaY,
      vx: Math.sin(rad) * VELOCIDAD_PROYECTIL,
      vy: -Math.cos(rad) * VELOCIDAD_PROYECTIL,
      vida: VIDA_PROYECTIL
    });
    ultimoDisparo = now;
  }

  // Actualizar proyectiles
  for (const p of proyectiles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vida -= dt * 1000;
  }
  proyectiles = proyectiles.filter(p =>
    p.x >= 0 && p.x < ANCHO && p.y >= 0 && p.y < ALTO && p.vida > 0
  );

  // Pantalla envolvente
  posX = ((posX % ANCHO) + ANCHO) % ANCHO;
  posY = ((posY % ALTO) + ALTO) % ALTO;

  // Dibujar
  dibujarFondo();

  // Nave
  const vertices = modeloTriangulo.map(v => transformarVertice(v, posX, posY, escala, angulo));
  ctx.beginPath();
  ctx.moveTo(vertices[0][0], vertices[0][1]);
  for (let i = 1; i < vertices.length; i++) {
    ctx.lineTo(vertices[i][0], vertices[i][1]);
  }
  ctx.closePath();
  ctx.strokeStyle = '#50ff96';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Proyectiles
  ctx.fillStyle = '#ffdc50';
  for (const p of proyectiles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
